name: Verify
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r worker/requirements.txt
      - run: python -m unittest discover -s tests -v
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select SDK and generate project
        run: |
          set -euo pipefail
          test -d /Applications/Xcode_26.0.app
          sudo xcode-select -s /Applications/Xcode_26.0.app
          brew install xcodegen
          xcodegen generate
      - name: Build and test
        run: |
          set -euo pipefail
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for k,v in d["devices"].items() if "iOS" in k for x in v if "iPhone" in x["name"]))')
          xcodebuild test -project CardLedger.xcodeproj -scheme CardLedger -destination "platform=iOS Simulator,id=$DEVICE" CODE_SIGNING_ALLOWED=NO -resultBundlePath TestResults.xcresult
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-test-results
          path: TestResults.xcresult
