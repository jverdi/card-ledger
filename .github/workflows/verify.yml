name: Verify
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      suite:
        description: Validation suite (focused checks never upload a build)
        type: choice
        options: [all, orientation, interaction]
        default: all
permissions:
  contents: read
jobs:
  ios:
    timeout-minutes: 35
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select SDK and generate project
        run: |
          set -euo pipefail
          test -d /Applications/Xcode_26.0.app
          sudo xcode-select -s /Applications/Xcode_26.0.app
          brew install xcodegen
          xcodegen generate
      - name: Build and test
        env:
          CARD_LEDGER_TEST_SUITE: ${{ inputs.suite || 'all' }}
        run: |
          set -euo pipefail
          python3 scripts/test-ios.py --suite "$CARD_LEDGER_TEST_SUITE"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-test-results
          path: TestResults.xcresult

